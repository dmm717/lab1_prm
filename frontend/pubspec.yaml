name: paper_chat_ai
description: "A modern desktop application to analyze and chat with research papers using GROBID and Google Gemini."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & HTTP
  http: ^1.2.1
  dio: ^5.4.1

  # TEI-XML Parsing for GROBID output
  xml: ^6.5.0

  # Google Gemini AI SDK
  google_generative_ai: ^0.4.4

  # UI & Markdown / LaTeX Rendering
  flutter_markdown: ^0.7.1
  flutter_math_fork: ^0.7.2
  google_fonts: ^6.1.0

  # State Management & Persistence
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Utility
  uuid: ^4.4.0
  intl: ^0.19.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
