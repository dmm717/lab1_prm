version: '3.8'

services:
  grobid:
    image: grobid/grobid:0.8.1
    container_name: paperchat-grobid
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      - GROBID_MAX_POOL_SIZE=10
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8070/api/isalive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
